<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        body {
            margin: 0;
            background-color: white;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
        }

        .logo {
            position: absolute;
            top: -30px;
            left: 15px;
            padding: 10px;
            z-index: 10; /* Ensure the logo is on top of the video */
        }

        .logo img {
            max-width: 300px; /* Set a size to prevent it from being invisible */
            height: auto;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay muted loop>
            <source src="https://garden-reel.s3.us-east-2.amazonaws.com/gardenReelRough.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Logo container inside the body -->
    <div class="logo">
        <img src="https://garden-reel.s3.us-east-2.amazonaws.com/Garden_White.png" alt="Logo">
    </div>
</body>
</html>
